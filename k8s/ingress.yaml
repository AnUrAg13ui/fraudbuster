apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fraudbuster-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: fraudbuster.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fraudbuster-service
            port:
              number: 80
